[project]
name = "kursovoy-project1"
version = "0.1.0"
description = ""
authors = [
    {name = "Вероника Мазуренко",email = "veronikavv1732@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openpyxl (>=3.1.5,<4.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "finnhub-python (>=2.4.26,<3.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-html (>=4.2.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"

[tool.black]
line-length = 119
exclude = ".git"

[tool.flake8]
line-length = 119
exclude = ".git"
#exclude = "__pycache__"

[tool.isort]
line_length = 119

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=25.12.0,<26.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "isort (>=7.0.0,<8.0.0)"
]
